<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wattpad JSON Reader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js para Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wattpad: { orange: '#ff5000', dark: '#1a1a1a', card: '#242424', reader: '#121212' }
                    }
                }
            }
        }
    </script>
    <style>
        .reader-content p { margin-bottom: 1.25rem; line-height: 1.8; }
        .reader-content h1, .reader-content h2, .reader-content h3 { font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .reader-content strong { color: currentColor; font-weight: bold; }
        .reader-content em { font-style: italic; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-wattpad-dark text-gray-800 dark:text-gray-200 font-sans transition-colors duration-300 antialiased select-none">

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col relative bg-white dark:bg-wattpad-reader shadow-2xl">

        <!-- VISTA 1: BIBLIOTECA / INICIO -->
        <div id="view-library" class="flex-1 flex flex-col pb-20">
            <!-- Header -->
            <header class="px-6 pt-6 pb-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800">
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-wattpad-orange"><i class="fa-solid fa-book-open-reader mr-2"></i>Illyrium Reader</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Lector para JSON y Markdown</p>
                </div>
                <button onclick="openSettings()" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 active:scale-95 transition">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </header>

            <!-- Carga de Archivos -->
            <div class="px-6 py-4">
                <label for="file-input" class="flex flex-col items-center justify-center border-2 border-dashed border-wattpad-orange/50 dark:border-wattpad-orange/40 rounded-2xl p-6 bg-orange-50/50 dark:bg-wattpad-orange/5 cursor-pointer hover:bg-orange-100/50 transition">
                    <div class="w-12 h-12 rounded-full bg-wattpad-orange text-white flex items-center justify-center text-xl shadow-lg shadow-wattpad-orange/30 mb-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-700 dark:text-gray-200">Seleccionar Archivo JSON</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400 mt-1">Soporta chats de Qwen, ChatGPT y más</span>
                    <input type="file" id="file-input" accept=".json,.txt" class="hidden" onchange="handleFileSelect(event)">
                </label>
            </div>

            <!-- Lista de Libros / Historial -->
            <div class="px-6 flex-1">
                <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3">Tus Lecturas</h2>
                <div id="book-list" class="space-y-3">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>

        <!-- VISTA 2: ÍNDICE DE CAPÍTULOS -->
        <div id="view-toc" class="hidden flex-1 flex flex-col pb-20">
            <div class="px-6 pt-6 pb-4 flex items-center border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-wattpad-reader backdrop-blur sticky top-0 z-10">
                <button onclick="goLibrary()" class="mr-4 text-lg text-gray-600 dark:text-gray-300"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 id="toc-book-title" class="text-lg font-bold truncate">Título del Libro</h2>
            </div>
            <div class="px-6 py-4 flex-1 overflow-y-auto">
                <div id="toc-chapters-list" class="divide-y divide-gray-100 dark:divide-gray-800">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>

        <!-- VISTA 3: LECTOR -->
        <div id="view-reader" class="hidden flex-1 flex flex-col relative bg-white dark:bg-wattpad-reader">
            <div id="reader-header" class="absolute top-0 left-0 right-0 px-6 py-4 flex items-center justify-between bg-white/90 dark:bg-wattpad-reader/90 backdrop-blur border-b border-gray-200 dark:border-gray-800 z-30 transition-transform duration-300">
                <button onclick="goToc()" class="text-gray-600 dark:text-gray-300 text-lg"><i class="fa-solid fa-list"></i></button>
                <span id="reader-chapter-title" class="text-xs font-bold truncate max-w-[200px] text-center">Capítulo</span>
                <button onclick="openSettings()" class="text-gray-600 dark:text-gray-300 text-lg"><i class="fa-solid fa-sliders"></i></button>
            </div>

            <div id="reader-container" onclick="toggleReaderControls()" class="flex-1 px-6 pt-20 pb-24 overflow-y-auto reader-content text-base selection:bg-wattpad-orange selection:text-white">
                <!-- Render dinámico -->
            </div>

            <div id="reader-footer" class="absolute bottom-0 left-0 right-0 px-6 py-3 bg-white/90 dark:bg-wattpad-reader/90 backdrop-blur border-t border-gray-200 dark:border-gray-800 flex items-center justify-between z-30 transition-transform duration-300">
                <button onclick="prevChapter()" class="px-4 py-2 text-sm font-bold bg-gray-100 dark:bg-gray-800 rounded-xl active:scale-95 transition"><i class="fa-solid fa-chevron-left mr-1"></i> Anterior</button>
                <span id="reader-progress" class="text-xs text-gray-400">1 / 1</span>
                <button onclick="nextChapter()" class="px-4 py-2 text-sm font-bold bg-wattpad-orange text-white rounded-xl active:scale-95 transition">Siguiente <i class="fa-solid fa-chevron-right ml-1"></i></button>
            </div>
        </div>

        <!-- MODAL DE CONFIGURACIÓN -->
        <div id="modal-settings" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center">
            <div class="bg-white dark:bg-wattpad-card w-full max-w-md rounded-t-3xl p-6 space-y-5">
                <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-800 pb-3">
                    <h3 class="font-bold text-lg">Ajustes de Lectura</h3>
                    <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2 block">Tema</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="setTheme('light')" class="py-2.5 bg-white text-gray-800 border border-gray-300 rounded-xl font-bold text-xs shadow-sm">Claro</button>
                        <button onclick="setTheme('dark')" class="py-2.5 bg-wattpad-dark text-white border border-gray-700 rounded-xl font-bold text-xs">Oscuro</button>
                        <button onclick="setTheme('sepia')" class="py-2.5 bg-[#f4ecd8] text-[#5f4b32] border border-[#d8ccc0] rounded-xl font-bold text-xs">Sepia</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2 block">Tamaño de Letra</label>
                    <div class="flex items-center justify-between bg-gray-100 dark:bg-gray-800 p-2 rounded-xl">
                        <button onclick="adjustFontSize(-2)" class="w-10 h-10 bg-white dark:bg-gray-700 rounded-lg font-bold shadow-sm">-</button>
                        <span id="font-size-display" class="text-sm font-bold">17px</span>
                        <button onclick="adjustFontSize(2)" class="w-10 h-10 bg-white dark:bg-gray-700 rounded-lg font-bold shadow-sm">+</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE NAVEGACIÓN Y PARSER ULTRA COMPATIBLE -->
    <script>
        let currentBook = { title: "Sin título", chapters: [] };
        let currentChapterIndex = 0;
        let readerSettings = { theme: 'dark', fontSize: 17 };
        let controlsVisible = true;

        window.addEventListener('DOMContentLoaded', () => {
            const savedSettings = localStorage.getItem('reader_settings');
            if (savedSettings) {
                readerSettings = JSON.parse(savedSettings);
                applySettings();
            }
            renderLibrary();
        });

        function setTheme(theme) {
            readerSettings.theme = theme;
            applySettings();
        }

        function adjustFontSize(delta) {
            readerSettings.fontSize = Math.min(Math.max(12, readerSettings.fontSize + delta), 28);
            applySettings();
        }

        function applySettings() {
            localStorage.setItem('reader_settings', JSON.stringify(readerSettings));
            const app = document.getElementById('app');
            app.className = "max-w-md mx-auto min-h-screen flex flex-col relative shadow-2xl transition-colors duration-300 ";
            
            if (readerSettings.theme === 'light') app.classList.add('bg-white', 'text-gray-900');
            else if (readerSettings.theme === 'dark') app.classList.add('bg-wattpad-reader', 'text-gray-100');
            else if (readerSettings.theme === 'sepia') app.classList.add('bg-[#f4ecd8]', 'text-[#5f4b32]');

            document.getElementById('reader-container').style.fontSize = readerSettings.fontSize + 'px';
            document.getElementById('font-size-display').innerText = readerSettings.fontSize + 'px';
        }

        function openSettings() { document.getElementById('modal-settings').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('modal-settings').classList.add('hidden'); }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const rawData = JSON.parse(e.target.result);
                    parseUniversalJSON(rawData, file.name);
                } catch (err) {
                    alert("El archivo no es un JSON válido o está dañado.");
                }
            };
            reader.readAsText(file);
        }

        // PARSER UNIVERSAL (Especialmente adaptado para cualquier estructura de JSON)
        function parseUniversalJSON(data, fileName) {
            let chapters = [];
            let bookTitle = fileName.replace('.json', '');

            // Función interna para extraer texto de campos complejos/arrays
            function extractText(val) {
                if (typeof val === 'string') return val;
                if (Array.isArray(val)) {
                    return val.map(v => extractText(v)).join('\n\n');
                }
                if (typeof val === 'object' && val !== null) {
                    if (val.text) return extractText(val.text);
                    if (val.content) return extractText(val.content);
                }
                return '';
            }

            // MÉTODOS DE BÚSQUEDA

            // 1. Recorrido recursivo buscando objetos con rol 'assistant' o 'bot'
            function findAssistantMessages(obj) {
                if (!obj || typeof obj !== 'object') return;

                if (Array.isArray(obj)) {
                    obj.forEach(item => findAssistantMessages(item));
                    return;
                }

                // Verificar si este objeto representa un mensaje de la IA
                let role = obj.role || obj.type || obj.author_role;
                if (role && (role === 'assistant' || role === 'bot' || role === 'model')) {
                    let txt = extractText(obj.content || obj.text || obj.message);
                    if (txt && txt.trim().length > 20) {
                        chapters.push({
                            title: `Capítulo ${chapters.length + 1}`,
                            text: txt.trim()
                        });
                        return;
                    }
                }

                // Si tiene hijos, seguir buscando
                for (let key in obj) {
                    if (typeof obj[key] === 'object') {
                        findAssistantMessages(obj[key]);
                    }
                }
            }

            // 2. Método de respaldo extremo: Extraer cualquier bloque de texto largo
            function findAnyLongText(obj) {
                if (!obj || typeof obj !== 'object') return;

                if (Array.isArray(obj)) {
                    obj.forEach(item => findAnyLongText(item));
                    return;
                }

                for (let key in obj) {
                    let val = obj[key];
                    if (typeof val === 'string' && val.trim().length > 60) {
                        // Evitar agregar metadatos o UUIDs cortando textos repetidos
                        let txt = val.trim();
                        if (!chapters.some(ch => ch.text === txt)) {
                            chapters.push({
                                title: `Capítulo ${chapters.length + 1}`,
                                text: txt
                            });
                        }
                    } else if (typeof val === 'object') {
                        findAnyLongText(val);
                    }
                }
            }

            // Ejecutar Búsquedas
            findAssistantMessages(data);

            // Si el método por roles no halló nada, usar la búsqueda profunda de textos
            if (chapters.length === 0) {
                findAnyLongText(data);
            }

            if (chapters.length === 0) {
                alert("No se pudo extraer ningún texto legible de este archivo JSON.");
                return;
            }

            currentBook = { title: bookTitle, chapters: chapters };
            saveBookToLocalStorage(currentBook);
            renderLibrary();
            openToc();
        }

        function saveBookToLocalStorage(book) {
            let saved = JSON.parse(localStorage.getItem('illyrium_books') || '[]');
            saved = saved.filter(b => b.title !== book.title);
            saved.unshift(book);
            localStorage.setItem('illyrium_books', JSON.stringify(saved));
        }

        function renderLibrary() {
            const listEl = document.getElementById('book-list');
            const saved = JSON.parse(localStorage.getItem('illyrium_books') || '[]');
            
            if (saved.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">No hay historias guardadas aún. Carga un archivo JSON arriba.</p>`;
                return;
            }

            listEl.innerHTML = saved.map((book, index) => `
                <div onclick="loadBook(${index})" class="flex items-center justify-between p-4 bg-white dark:bg-wattpad-card rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm cursor-pointer active:scale-98 transition">
                    <div class="flex items-center space-x-3 truncate">
                        <div class="w-10 h-10 rounded-xl bg-orange-100 dark:bg-wattpad-orange/20 text-wattpad-orange flex items-center justify-center font-bold">
                            <i class="fa-solid fa-book"></i>
                        </div>
                        <div class="truncate">
                            <h3 class="font-bold text-sm truncate">${book.title}</h3>
                            <p class="text-xs text-gray-400">${book.chapters.length} capítulos</p>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); deleteBook(${index})" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
                </div>
            `).join('');
        }

        function loadBook(index) {
            const saved = JSON.parse(localStorage.getItem('illyrium_books') || '[]');
            currentBook = saved[index];
            openToc();
        }

        function deleteBook(index) {
            let saved = JSON.parse(localStorage.getItem('illyrium_books') || '[]');
            saved.splice(index, 1);
            localStorage.setItem('illyrium_books', JSON.stringify(saved));
            renderLibrary();
        }

        function goLibrary() {
            document.getElementById('view-toc').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-library').classList.remove('hidden');
            renderLibrary();
        }

        function openToc() {
            document.getElementById('view-library').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-toc').classList.remove('hidden');

            document.getElementById('toc-book-title').innerText = currentBook.title;
            const listEl = document.getElementById('toc-chapters-list');
            
            listEl.innerHTML = currentBook.chapters.map((ch, idx) => `
                <div onclick="openReader(${idx})" class="py-3.5 px-2 flex items-center justify-between cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800/50 transition">
                    <span class="text-sm font-medium truncate pr-4">${ch.title}</span>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                </div>
            `).join('');
        }

        function goToc() { openToc(); }

        function openReader(index) {
            currentChapterIndex = index;
            document.getElementById('view-toc').classList.add('hidden');
            document.getElementById('view-reader').classList.remove('hidden');
            renderChapter();
        }

        function renderChapter() {
            const chapter = currentBook.chapters[currentChapterIndex];
            document.getElementById('reader-chapter-title').innerText = chapter.title;
            document.getElementById('reader-progress').innerText = `${currentChapterIndex + 1} / ${currentBook.chapters.length}`;
            
            // Renderizar Markdown con marked.js
            document.getElementById('reader-container').innerHTML = marked.parse(chapter.text);
            document.getElementById('reader-container').scrollTop = 0;
        }

        function nextChapter() {
            if (currentChapterIndex < currentBook.chapters.length - 1) {
                currentChapterIndex++;
                renderChapter();
            }
        }

        function prevChapter() {
            if (currentChapterIndex > 0) {
                currentChapterIndex--;
                renderChapter();
            }
        }

        function toggleReaderControls() {
            const header = document.getElementById('reader-header');
            const footer = document.getElementById('reader-footer');
            if (controlsVisible) {
                header.classList.add('-translate-y-full');
                footer.classList.add('translate-y-full');
            } else {
                header.classList.remove('-translate-y-full');
                footer.classList.remove('translate-y-full');
            }
            controlsVisible = !controlsVisible;
        }
    </script>
</body>
</html>
