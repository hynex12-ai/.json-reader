<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Illyrium Reader - Editor y Lector</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js para Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pastel: { pink: '#ffb7b2', dark: '#1a1618', card: '#262023', reader: '#1a1618' }
                    }
                }
            }
        }
    </script>
    <style>
        .reader-content p { margin-bottom: 1.25rem; line-height: 1.8; }
        .reader-content h1, .reader-content h2, .reader-content h3 { font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .reader-content strong { color: currentColor; font-weight: bold; }
        .reader-content em { font-style: italic; }
        
        /* Ocultar barra de scroll lateral manteniendo la funcionalidad */
        #reader-container::-webkit-scrollbar { display: none; }
        #reader-container { -ms-overflow-style: none; scrollbar-width: none; }

        /* Tipografías personalizadas */
        .font-sans-custom { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .font-serif-custom { font-family: Cambria, Georgia, 'Times New Roman', serif; }
        .font-mono-custom { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-pastel-dark text-gray-800 dark:text-gray-200 font-sans-custom transition-colors duration-300 antialiased overflow-hidden">

    <!-- Contenedor general forzado a altura de pantalla exacta -->
    <div id="app" class="max-w-md mx-auto h-[100dvh] flex flex-col relative bg-white dark:bg-pastel-reader shadow-2xl overflow-hidden">

        <!-- VISTA 1: BIBLIOTECA -->
        <div id="view-library" class="flex-1 flex flex-col h-full overflow-y-auto pb-20 select-none">
            <header class="px-6 pt-6 pb-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 shrink-0">
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-pastel-pink"><i class="fa-solid fa-book-open-reader mr-2"></i>Illyrium Reader</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Control total de capítulos</p>
                </div>
                <button onclick="openSettings()" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 active:scale-95 transition">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </header>

            <div class="px-6 py-4 shrink-0">
                <label for="file-input" class="flex flex-col items-center justify-center border-2 border-dashed border-pastel-pink/50 dark:border-pastel-pink/40 rounded-2xl p-6 bg-pink-50/50 dark:bg-pastel-pink/5 cursor-pointer hover:bg-pink-100/50 transition">
                    <div class="w-12 h-12 rounded-full bg-pastel-pink text-gray-900 flex items-center justify-center text-xl shadow-lg shadow-pastel-pink/30 mb-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-700 dark:text-gray-200">Subir Archivo JSON</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400 mt-1">Extracción automática de respuestas del asistente</span>
                    <input type="file" id="file-input" accept=".json,.txt" class="hidden" onchange="handleFileSelect(event)">
                </label>
            </div>

            <div class="px-6 flex-1 pb-10">
                <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3">Tus Libros</h2>
                <div id="book-list" class="space-y-3"></div>
            </div>
        </div>

        <!-- VISTA 2: SELECTOR / CURADOR DE CAPÍTULOS -->
        <div id="view-selector" class="hidden flex-1 flex flex-col h-full overflow-hidden select-none">
            <div class="px-6 pt-6 pb-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 bg-white/90 dark:bg-pastel-reader/90 backdrop-blur shrink-0 z-10">
                <div class="flex items-center">
                    <button onclick="goLibrary()" class="mr-4 text-lg text-gray-600 dark:text-gray-300"><i class="fa-solid fa-arrow-left"></i></button>
                    <h2 class="text-base font-bold">Selecciona los Capítulos</h2>
                </div>
                <button onclick="saveCuratedBook()" class="px-3 py-1.5 bg-pastel-pink text-gray-900 text-xs font-bold rounded-xl shadow-md">Guardar Libro</button>
            </div>
            <div class="px-6 py-3 bg-pink-50 dark:bg-pastel-pink/10 border-b border-pink-100 dark:border-pastel-pink/20 text-xs text-pastel-pink font-medium shrink-0">
                Se han filtrado las respuestas del asistente. Revisa y desmarca bloques innecesarios si lo deseas.
            </div>
            <div class="px-6 py-4 flex-1 overflow-y-auto space-y-3" id="selector-list"></div>
        </div>

        <!-- VISTA 3: ÍNDICE -->
        <div id="view-toc" class="hidden flex-1 flex flex-col h-full overflow-hidden select-none">
            <div class="px-6 pt-6 pb-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-pastel-reader backdrop-blur shrink-0 z-10">
                <div class="flex items-center truncate pr-2">
                    <button onclick="goLibrary()" class="mr-4 text-lg text-gray-600 dark:text-gray-300"><i class="fa-solid fa-arrow-left"></i></button>
                    <h2 id="toc-book-title" class="text-lg font-bold truncate">Título</h2>
                </div>
                <button onclick="goLibrary()" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300"><i class="fa-solid fa-house text-xs"></i></button>
            </div>
            <div class="px-6 py-4 flex-1 overflow-y-auto">
                <div id="toc-chapters-list" class="divide-y divide-gray-100 dark:divide-gray-800"></div>
            </div>
        </div>

        <!-- VISTA 4: LECTOR -->
        <div id="view-reader" class="hidden flex-1 flex flex-col h-full relative bg-white dark:bg-pastel-reader overflow-hidden">
            
            <!-- Menú flotante personalizado para añadir a notas -->
            <div id="selection-tooltip" class="hidden absolute z-50 bg-[#262023] text-white px-4 py-2.5 rounded-2xl shadow-2xl flex items-center space-x-3 border border-pastel-pink/50">
                <button onclick="saveSelectedTextAsNote()" class="text-xs font-bold text-pastel-pink flex items-center"><i class="fa-solid fa-note-sticky mr-2 text-sm"></i> Añadir a Notas</button>
                <div class="w-[1px] h-4 bg-gray-700"></div>
                <button onclick="dismissTooltip()" class="text-gray-400 hover:text-white px-1"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>

            <!-- Sidebar de Capítulos y Notas (Deslizable tipo Sidebar) -->
            <div id="chapter-sidebar" class="absolute inset-y-0 left-0 w-72 bg-white dark:bg-pastel-card shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col border-r border-gray-200 dark:border-gray-800 select-none">
                <div class="px-5 py-4 flex items-center justify-between border-b border-gray-100 dark:border-gray-800">
                    <h3 class="font-bold text-sm text-pastel-pink">Menú del Libro</h3>
                    <button onclick="toggleChapterSidebar()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                
                <!-- Pestañas de navegación del Sidebar -->
                <div class="flex border-b border-gray-100 dark:border-gray-800 text-xs font-bold">
                    <button onclick="switchSidebarTab('chapters')" id="tab-chapters-btn" class="flex-1 py-2.5 text-center text-pastel-pink border-b-2 border-pastel-pink">Capítulos</button>
                    <button onclick="switchSidebarTab('notes')" id="tab-notes-btn" class="flex-1 py-2.5 text-center text-gray-400 border-b-2 border-transparent">Notas (<span id="notes-count">0</span>)</button>
                </div>

                <!-- Contenido de Pestañas -->
                <div class="flex-1 overflow-y-auto p-3">
                    <div id="sidebar-chapters-list" class="space-y-1"></div>
                    <div id="sidebar-notes-list" class="space-y-2 hidden"></div>
                </div>
            </div>

            <!-- Header Superior -->
            <div id="reader-header" class="absolute top-0 left-0 right-0 px-6 py-4 flex items-center justify-between bg-white/90 dark:bg-pastel-reader/90 backdrop-blur border-b border-gray-200 dark:border-gray-800 z-30 transition-transform duration-300 select-none">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleChapterSidebar()" class="text-gray-600 dark:text-gray-300 text-lg" title="Ver Menú"><i class="fa-solid fa-list-ul"></i></button>
                    <button onclick="goLibrary()" class="text-gray-600 dark:text-gray-300 text-base" title="Ir al Home"><i class="fa-solid fa-house"></i></button>
                </div>
                <span id="reader-chapter-title" class="text-xs font-bold truncate max-w-[150px] text-center">Capítulo</span>
                <button onclick="openSettings()" class="text-gray-600 dark:text-gray-300 text-lg"><i class="fa-solid fa-sliders"></i></button>
            </div>

            <!-- Contenedor del lector -->
            <div id="reader-container" onscroll="handleScroll()" class="flex-1 min-h-0 px-6 pt-20 pb-28 overflow-y-auto reader-content text-base selection:bg-pastel-pink selection:text-gray-900"></div>

            <!-- Footer / Controles inferiores con barra horizontal -->
            <div id="reader-footer" class="absolute bottom-0 left-0 right-0 px-6 py-3 bg-white/95 dark:bg-pastel-reader/95 backdrop-blur border-t border-gray-200 dark:border-gray-800 flex flex-col z-30 transition-transform duration-300 space-y-2 select-none">
                
                <!-- Barra de Scroll Horizontal Inferior -->
                <div class="flex items-center space-x-3">
                    <span id="scroll-percent" class="text-[10px] text-gray-400 font-mono w-8 text-right">0%</span>
                    <input type="range" id="chapter-scrollbar" min="0" max="100" value="0" step="0.1" oninput="onSliderScroll(this.value)" class="w-full accent-pastel-pink cursor-pointer h-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg">
                </div>

                <!-- Botones de navegación inferiores -->
                <div class="flex items-center justify-between">
                    <button onclick="prevChapter()" class="px-4 py-1.5 text-xs font-bold bg-gray-100 dark:bg-gray-800 rounded-xl active:scale-95 transition"><i class="fa-solid fa-chevron-left mr-1"></i> Anterior</button>
                    <span id="reader-progress" class="text-xs text-gray-400">1 / 1</span>
                    <button onclick="nextChapter()" class="px-4 py-1.5 text-xs font-bold bg-pastel-pink text-gray-900 rounded-xl active:scale-95 transition">Siguiente <i class="fa-solid fa-chevron-right ml-1"></i></button>
                </div>
            </div>
        </div>

        <!-- MODAL AJUSTES -->
        <div id="modal-settings" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center select-none">
            <div class="bg-white dark:bg-pastel-card w-full max-w-md rounded-t-3xl p-6 space-y-5">
                <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-800 pb-3">
                    <h3 class="font-bold text-lg">Ajustes de Lectura</h3>
                    <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2 block">Tema</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="setTheme('light')" class="py-2.5 bg-white text-gray-800 border border-gray-300 rounded-xl font-bold text-xs shadow-sm">Claro</button>
                        <button onclick="setTheme('dark')" class="py-2.5 bg-pastel-dark text-white border border-gray-700 rounded-xl font-bold text-xs">Oscuro</button>
                        <button onclick="setTheme('sepia')" class="py-2.5 bg-[#f4ecd8] text-[#5f4b32] border border-[#d8ccc0] rounded-xl font-bold text-xs">Sepia</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2 block">Tipografía</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="setFontFamily('sans')" class="py-2 bg-gray-100 dark:bg-gray-800 rounded-xl text-xs font-sans-custom font-bold">Sans</button>
                        <button onclick="setFontFamily('serif')" class="py-2 bg-gray-100 dark:bg-gray-800 rounded-xl text-xs font-serif-custom font-bold">Serif</button>
                        <button onclick="setFontFamily('mono')" class="py-2 bg-gray-100 dark:bg-gray-800 rounded-xl text-xs font-mono-custom font-bold">Mono</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2 block">Tamaño de Letra</label>
                    <div class="flex items-center justify-between bg-gray-100 dark:bg-gray-800 p-2 rounded-xl">
                        <button onclick="adjustFontSize(-2)" class="w-10 h-10 bg-white dark:bg-gray-700 rounded-lg font-bold shadow-sm">-</button>
                        <span id="font-size-display" class="text-sm font-bold">17px</span>
                        <button onclick="adjustFontSize(2)" class="w-10 h-10 bg-white dark:bg-gray-700 rounded-lg font-bold shadow-sm">+</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentBook = { title: "Sin título", chapters: [], lastChapterIndex: 0, scrollPositions: {}, notes: [] };
        let tempExtractedItems = [];
        let currentChapterIndex = 0;
        let readerSettings = { theme: 'dark', fontSize: 17, font: 'sans' };
        let controlsVisible = true;
        let scrollTimeout = null;
        let isSyncingSlider = false;
        let selectedTextToSave = "";
        let longPressTimer = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedSettings = localStorage.getItem('reader_settings');
            if (savedSettings) {
                readerSettings = JSON.parse(savedSettings);
            }
            applySettings();
            renderLibrary();
            initLongPressSelection();
        });

        // MECANISMO TÁCTIL DE PULSACIÓN PROLONGADA (IDEAL PARA APK ANDROID)
        function initLongPressSelection() {
            const container = document.getElementById('reader-container');
            
            container.addEventListener('touchstart', (e) => {
                longPressTimer = setTimeout(() => {
                    // Al mantener presionado 500ms, intentamos capturar la palabra o texto bajo el toque
                    let sel = window.getSelection();
                    if (!sel.toString().trim()) {
                        // Si no hay selección activa, simulamos seleccionar la palabra cercana o permitimos la nativa
                    }
                }, 500);
            }, { passive: true });

            container.addEventListener('touchend', () => {
                clearTimeout(longPressTimer);
                checkActiveSelection();
            });

            container.addEventListener('mouseup', () => {
                checkActiveSelection();
            });
        }

        function checkActiveSelection() {
            setTimeout(() => {
                const selection = window.getSelection();
                const text = selection.toString().trim();
                const tooltip = document.getElementById('selection-tooltip');

                if (text.length > 0) {
                    selectedTextToSave = text;
                    try {
                        const range = selection.getRangeAt(0);
                        const rect = range.getBoundingClientRect();
                        const appRect = document.getElementById('app').getBoundingClientRect();
                        
                        let topPos = rect.top - appRect.top - 60;
                        let leftPos = rect.left + (rect.width / 2) - appRect.left;
                        
                        if (topPos < 50) topPos = rect.bottom - appRect.top + 15;

                        tooltip.style.top = `${Math.max(20, topPos)}px`;
                        tooltip.style.left = `${Math.max(20, Math.min(leftPos, appRect.width - 20))}px`;
                        tooltip.style.transform = 'translateX(-50%)';
                        tooltip.classList.remove('hidden');
                    } catch (e) {
                        tooltip.style.top = '100px';
                        tooltip.style.left = '50%';
                        tooltip.style.transform = 'translateX(-50%)';
                        tooltip.classList.remove('hidden');
                    }
                } else {
                    tooltip.classList.add('hidden');
                }
            }, 150);
        }

        function dismissTooltip() {
            document.getElementById('selection-tooltip').classList.add('hidden');
            window.getSelection().removeAllRanges();
        }

        function saveSelectedTextAsNote() {
            if (!selectedTextToSave) return;
            if (!currentBook.notes) currentBook.notes = [];

            currentBook.notes.push({
                text: selectedTextToSave,
                chapterTitle: currentBook.chapters[currentChapterIndex].title,
                date: new Date().toLocaleDateString()
            });

            saveBookToLocalStorage(currentBook);
            dismissTooltip();
            renderSidebarContent();
            
            const alertBox = document.createElement('div');
            alertBox.className = "absolute bottom-16 left-1/2 -translate-x-1/2 bg-pastel-pink text-gray-950 text-xs font-bold px-3 py-1.5 rounded-xl shadow-lg z-50 transition";
            alertBox.innerText = "¡Nota guardada!";
            document.getElementById('view-reader').appendChild(alertBox);
            setTimeout(() => alertBox.remove(), 2000);
        }

        function setTheme(theme) { readerSettings.theme = theme; applySettings(); }
        function setFontFamily(font) { readerSettings.font = font; applySettings(); }
        function adjustFontSize(delta) {
            readerSettings.fontSize = Math.min(Math.max(12, readerSettings.fontSize + delta), 28);
            applySettings();
        }

        function applySettings() {
            localStorage.setItem('reader_settings', JSON.stringify(readerSettings));
            
            const htmlEl = document.documentElement;
            const app = document.getElementById('app');
            const readerContainer = document.getElementById('reader-container');

            app.className = "max-w-md mx-auto h-[100dvh] flex flex-col relative shadow-2xl transition-colors duration-300 overflow-hidden ";
            htmlEl.classList.remove('dark');

            if (readerSettings.theme === 'light') {
                app.classList.add('bg-white', 'text-gray-900');
            } else if (readerSettings.theme === 'dark') {
                htmlEl.classList.add('dark');
                app.classList.add('bg-pastel-reader', 'text-gray-100');
            } else if (readerSettings.theme === 'sepia') {
                app.classList.add('bg-[#f4ecd8]', 'text-[#5f4b32]');
            }

            readerContainer.classList.remove('font-sans-custom', 'font-serif-custom', 'font-mono-custom');
            if (readerSettings.font === 'sans') readerContainer.classList.add('font-sans-custom');
            else if (readerSettings.font === 'serif') readerContainer.classList.add('font-serif-custom');
            else if (readerSettings.font === 'mono') readerContainer.classList.add('font-mono-custom');

            readerContainer.style.fontSize = readerSettings.fontSize + 'px';
            document.getElementById('font-size-display').innerText = readerSettings.fontSize + 'px';
        }

        function openSettings() { document.getElementById('modal-settings').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('modal-settings').classList.add('hidden'); }

        function toggleChapterSidebar() {
            const sidebar = document.getElementById('chapter-sidebar');
            sidebar.classList.toggle('-translate-x-full');
            if (!sidebar.classList.contains('-translate-x-full')) {
                renderSidebarContent();
            }
        }

        function switchSidebarTab(tab) {
            const chaptersBtn = document.getElementById('tab-chapters-btn');
            const notesBtn = document.getElementById('tab-notes-btn');
            const chaptersList = document.getElementById('sidebar-chapters-list');
            const notesList = document.getElementById('sidebar-notes-list');

            if (tab === 'chapters') {
                chaptersBtn.className = "flex-1 py-2.5 text-center text-pastel-pink border-b-2 border-pastel-pink";
                notesBtn.className = "flex-1 py-2.5 text-center text-gray-400 border-b-2 border-transparent";
                chaptersList.classList.remove('hidden');
                notesList.classList.add('hidden');
            } else {
                notesBtn.className = "flex-1 py-2.5 text-center text-pastel-pink border-b-2 border-pastel-pink";
                chaptersBtn.className = "flex-1 py-2.5 text-center text-gray-400 border-b-2 border-transparent";
                notesList.classList.remove('hidden');
                chaptersList.classList.add('hidden');
            }
        }

        function renderSidebarContent() {
            const listEl = document.getElementById('sidebar-chapters-list');
            listEl.innerHTML = currentBook.chapters.map((ch, idx) => `
                <div onclick="openReaderFromSidebar(${idx})" class="p-2.5 rounded-xl cursor-pointer text-xs truncate transition ${idx === currentChapterIndex ? 'bg-pastel-pink/20 text-pastel-pink font-bold' : 'hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300'}">
                    ${ch.title}
                </div>
            `).join('');

            if (!currentBook.notes) currentBook.notes = [];
            document.getElementById('notes-count').innerText = currentBook.notes.length;
            const notesEl = document.getElementById('sidebar-notes-list');
            
            if (currentBook.notes.length === 0) {
                notesEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">No hay notas guardadas aún.</p>`;
                return;
            }

            notesEl.innerHTML = currentBook.notes.map((note, idx) => `
                <div class="p-3 bg-gray-50 dark:bg-gray-800/60 rounded-xl relative group border border-gray-200 dark:border-gray-700">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[10px] font-bold text-pastel-pink">${note.chapterTitle}</span>
                        <button onclick="deleteNote(${idx})" class="text-gray-400 hover:text-red-400 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <p class="text-xs text-gray-700 dark:text-gray-300 italic">"${note.text}"</p>
                </div>
            `).join('');
        }

        function openReaderFromSidebar(index) {
            toggleChapterSidebar();
            openReader(index);
        }

        function deleteNote(index) {
            currentBook.notes.splice(index, 1);
            saveBookToLocalStorage(currentBook);
            renderSidebarContent();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const rawData = JSON.parse(e.target.result);
                    extractQwenAssistantBlocks(rawData, file.name);
                } catch (err) {
                    alert("Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
        }

        function extractQwenAssistantBlocks(data, fileName) {
            tempExtractedItems = [];
            let globalTitle = fileName.replace('.json', '');

            function recurse(obj) {
                if (!obj || typeof obj !== 'object') return;
                if (Array.isArray(obj)) {
                    obj.forEach(item => recurse(item));
                    return;
                }

                let role = (obj.role || obj.type || obj.author_role || '').toLowerCase();
                let txt = obj.content || obj.text || obj.message || obj.value;

                let isAssistant = role === 'assistant' || role === 'model' || role === 'bot';
                let isUser = role === 'user' || role === 'human';

                if (typeof txt === 'string' && txt.trim().length > 20) {
                    let cleanTxt = txt.trim();
                    if (isAssistant || (!isUser && !cleanTxt.toLowerCase().startsWith("actúa") && !cleanTxt.toLowerCase().startsWith("traduce"))) {
                        tempExtractedItems.push({ text: cleanTxt, selected: true });
                    }
                }

                for (let key in obj) {
                    if (typeof obj[key] === 'object') {
                        recurse(obj[key]);
                    }
                }
            }

            recurse(data);

            if (tempExtractedItems.length === 0) {
                alert("No se encontraron respuestas del asistente en este archivo.");
                return;
            }

            currentBook = {
                title: globalTitle,
                chapters: [],
                lastChapterIndex: 0,
                scrollPositions: {},
                notes: []
            };
            renderSelectorView();
        }

        function renderSelectorView() {
            document.getElementById('view-library').classList.add('hidden');
            document.getElementById('view-toc').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-selector').classList.remove('hidden');

            const listEl = document.getElementById('selector-list');
            listEl.innerHTML = tempExtractedItems.map((item, idx) => `
                <div class="p-3 bg-white dark:bg-pastel-card rounded-2xl border ${item.selected ? 'border-pastel-pink' : 'border-gray-200 dark:border-gray-800 opacity-60'} flex items-start space-x-3 transition">
                    <input type="checkbox" ${item.selected ? 'checked' : ''} onchange="toggleItemSelection(${idx})" class="mt-1 w-5 h-5 accent-pastel-pink rounded cursor-pointer">
                    <div class="flex-1 cursor-pointer" onclick="toggleItemSelection(${idx})">
                        <span class="text-xs font-bold text-pastel-pink block mb-1">Capítulo / Bloque #${idx + 1}</span>
                        <p class="text-xs line-clamp-3 text-gray-700 dark:text-gray-300">${item.text}</p>
                    </div>
                </div>
            `).join('');
        }

        function toggleItemSelection(idx) {
            tempExtractedItems[idx].selected = !tempExtractedItems[idx].selected;
            renderSelectorView();
        }

        function saveCuratedBook() {
            const selectedChapters = tempExtractedItems
                .filter(item => item.selected)
                .map((item, i) => ({ title: `Capítulo ${i + 1}`, text: item.text }));

            if (selectedChapters.length === 0) {
                alert("Debes seleccionar al menos un capítulo.");
                return;
            }

            currentBook.chapters = selectedChapters;
            currentBook.lastChapterIndex = 0;
            currentBook.scrollPositions = {};
            currentBook.notes = [];
            saveBookToLocalStorage(currentBook);
            openReader(0);
        }

        function saveBookToLocalStorage(book) {
            let saved = JSON.parse(localStorage.getItem('illyrium_books') || '[]');
            saved = saved.filter(b => b.title !== book.title);
            saved.unshift(book);
            localStorage.setItem('illyrium_books', JSON.stringify(saved));
        }

        function renderLibrary() {
            const listEl = document.getElementById('book-list');
            const saved = JSON.parse(localStorage.getItem('illyrium_books') || '[]');
            if (saved.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">No hay historias guardadas aún.</p>`;
                return;
            }
            listEl.innerHTML = saved.map((book, index) => {
                const progress = (book.lastChapterIndex || 0) + 1;
                return `
                <div onclick="loadBook(${index})" class="flex items-center justify-between p-4 bg-white dark:bg-pastel-card rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm cursor-pointer active:scale-98 transition">
                    <div class="flex items-center space-x-3 truncate">
                        <div class="w-10 h-10 rounded-xl bg-pink-100 dark:bg-pastel-pink/20 text-pastel-pink flex items-center justify-center font-bold"><i class="fa-solid fa-book"></i></div>
                        <div class="truncate">
                            <h3 class="font-bold text-sm truncate">${book.title}</h3>
                            <p class="text-xs text-gray-400">Progreso: Cap. ${progress} de ${book.chapters.length}</p>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); deleteBook(${index})" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
                </div>
            `;
            }).join('');
        }

        function loadBook(index) {
            const saved = JSON.parse(localStorage.getItem('illyrium_books') || '[]');
            currentBook = saved[index];
            if (!currentBook.scrollPositions) currentBook.scrollPositions = {};
            if (!currentBook.notes) currentBook.notes = [];
            const targetChapter = currentBook.lastChapterIndex || 0;
            openReader(targetChapter);
        }

        function deleteBook(index) {
            let saved = JSON.parse(localStorage.getItem('illyrium_books') || '[]');
            saved.splice(index, 1);
            localStorage.setItem('illyrium_books', JSON.stringify(saved));
            renderLibrary();
        }

        function goLibrary() {
            document.getElementById('view-selector').classList.add('hidden');
            document.getElementById('view-toc').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-library').classList.remove('hidden');
            renderLibrary();
        }

        function openToc() {
            document.getElementById('view-library').classList.add('hidden');
            document.getElementById('view-selector').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-toc').classList.remove('hidden');

            document.getElementById('toc-book-title').innerText = currentBook.title;
            const listEl = document.getElementById('toc-chapters-list');
            listEl.innerHTML = currentBook.chapters.map((ch, idx) => `
                <div onclick="openReader(${idx})" class="py-3.5 px-2 flex items-center justify-between cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800/50 transition ${idx === currentBook.lastChapterIndex ? 'text-pastel-pink font-bold' : ''}">
                    <span class="text-sm truncate pr-4">${ch.title}</span>
                    ${idx === currentBook.lastChapterIndex ? '<i class="fa-solid fa-bookmark text-xs"></i>' : '<i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>'}
                </div>
            `).join('');
        }

        function goToc() { openToc(); }

        function openReader(index) {
            currentChapterIndex = index;
            currentBook.lastChapterIndex = index;
            saveBookToLocalStorage(currentBook);

            document.getElementById('view-toc').classList.add('hidden');
            document.getElementById('view-library').classList.add('hidden');
            document.getElementById('view-selector').classList.add('hidden');
            document.getElementById('view-reader').classList.remove('hidden');
            renderChapter();
        }

        function renderChapter() {
            const chapter = currentBook.chapters[currentChapterIndex];
            if (!chapter) return;

            document.getElementById('reader-chapter-title').innerText = chapter.title;
            document.getElementById('reader-progress').innerText = `${currentChapterIndex + 1} / ${currentBook.chapters.length}`;
            
            const container = document.getElementById('reader-container');
            container.innerHTML = marked.parse(chapter.text);
            
            if (document.activeElement) {
                document.activeElement.blur();
            }

            const savedScroll = (currentBook.scrollPositions && currentBook.scrollPositions[currentChapterIndex]) || 0;
            
            requestAnimationFrame(() => {
                container.scrollTop = savedScroll;
                updateScrollbarUI();
                requestAnimationFrame(() => {
                    container.scrollTop = savedScroll;
                    updateScrollbarUI();
                });
            });
        }

        function handleScroll() {
            if (isSyncingSlider) return;
            const container = document.getElementById('reader-container');
            if (!container) return;

            updateScrollbarUI();

            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                if (!currentBook.scrollPositions) currentBook.scrollPositions = {};
                currentBook.scrollPositions[currentChapterIndex] = container.scrollTop;
                saveBookToLocalStorage(currentBook);
            }, 300);
        }

        function updateScrollbarUI() {
            const container = document.getElementById('reader-container');
            const slider = document.getElementById('chapter-scrollbar');
            const percentLabel = document.getElementById('scroll-percent');
            if (!container || !slider) return;

            const maxScroll = container.scrollHeight - container.clientHeight;
            const currentScroll = container.scrollTop;
            
            let percent = maxScroll > 0 ? (currentScroll / maxScroll) * 100 : 0;
            percent = Math.min(Math.max(percent, 0), 100);

            slider.value = percent;
            percentLabel.innerText = Math.round(percent) + '%';
        }

    function onSliderScroll(val) {
            isSyncingSlider = true;
            const container = document.getElementById('reader-container');
            if (!container) return;

            const maxScroll = container.scrollHeight - container.clientHeight;
            container.scrollTop = (val / 100) * maxScroll;
            document.getElementById('scroll-percent').innerText = Math.round(val) + '%';

            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                if (!currentBook.scrollPositions) currentBook.scrollPositions = {};
                currentBook.scrollPositions[currentChapterIndex] = container.scrollTop;
                saveBookToLocalStorage(currentBook);
                isSyncingSlider = false;
            }, 150);
        }

        function nextChapter() {
            if (currentChapterIndex < currentBook.chapters.length - 1) { 
                currentChapterIndex++; 
                currentBook.lastChapterIndex = currentChapterIndex;
                saveBookToLocalStorage(currentBook);
                renderChapter(); 
            }
        }

        function prevChapter() {
            if (currentChapterIndex > 0) { 
                currentChapterIndex--; 
                currentBook.lastChapterIndex = currentChapterIndex;
                saveBookToLocalStorage(currentBook);
                renderChapter(); 
            }
        }

        function toggleReaderControls() {
            const header = document.getElementById('reader-header');
            const footer = document.getElementById('reader-footer');
            if (controlsVisible) {
                header.classList.add('-translate-y-full');
                footer.classList.add('translate-y-full');
            } else {
                header.classList.remove('-translate-y-full');
                footer.classList.remove('translate-y-full');
            }
            controlsVisible = !controlsVisible;
        }
    </script>
</body>
</html>
